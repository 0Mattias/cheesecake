name: Build

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The mod's version comes from `git describe --tags`, so the build needs the tags and
          # enough history to reach one. A tag push therefore produces cheesecake-X.Y.Z.jar and a
          # branch push cheesecake-X.Y.Z-N-gSHA.jar, which keeps snapshots distinguishable.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Check the built jar
        run: |
          set -euo pipefail
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Inspecting $jar"

          # The Schematica/Litematica API stubs are compile-only. Shipping them would shadow the
          # real mods on Fabric's flat mod classpath.
          if unzip -l "$jar" | grep -E ' (fi/dy/masa|com/github/lunatrius)/'; then
            echo "::error::jar ships Schematica/Litematica stub classes"
            exit 1
          fi

          # The in-world test harness lives in its own source set so that it does not ship. Only
          # AutoTestHook, which looks the driver up by name, belongs in the jar.
          if unzip -l "$jar" | grep -E ' cheesecake/utils/autotest/'; then
            echo "::error::jar ships the in-world test harness"
            exit 1
          fi

          # The Nether pathfinder is the Java port under cheesecake.process.elytra.pathfinder, so
          # the jar carries it as classes and nests no library at all.
          if ! unzip -l "$jar" | grep -q 'cheesecake/process/elytra/pathfinder/NetherPathfinder.class'; then
            echo "::error::jar does not carry the Nether pathfinder"
            exit 1
          fi
          if unzip -l "$jar" | grep -q 'META-INF/jars/'; then
            echo "::error::jar nests a library; nothing is bundled any more"
            exit 1
          fi

          # processResources must have substituted the real version.
          unzip -p "$jar" fabric.mod.json | tee /tmp/fabric.mod.json
          if grep -q '\${version}' /tmp/fabric.mod.json; then
            echo "::error::fabric.mod.json version was not expanded"
            exit 1
          fi

          # The icon fabric.mod.json points at has to actually be in the jar.
          unzip -l "$jar" | grep -q 'assets/cheesecake/icon.png'

          # A tag build must be named after the tag, otherwise the tags were not fetched and the
          # jar would silently carry the fallback version from gradle.properties.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected="cheesecake-${GITHUB_REF_NAME#v}.jar"
            if [ "$(basename "$jar")" != "$expected" ]; then
              echo "::error::expected $expected for tag ${GITHUB_REF_NAME}, got $(basename "$jar")"
              exit 1
            fi
          fi

          echo "jar checks passed"

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cheesecake-jar
          path: build/libs/*.jar

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  # The build proves the mixin configs are well-formed. It does not prove they APPLY -- that
  # happens at class load in a running client. Launch one headless on software GL and fail on any
  # mixin error. Getting to the main menu means every @Mixin target, @Shadow and @Inject resolved
  # against the real Minecraft classes.
  smoke:
    name: headless client smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install a headless GL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libopenal1

      - name: Launch the client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set +e
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            timeout --signal=INT 300 ./gradlew runClient --no-daemon --stacktrace > client.log 2>&1
          echo "gradle exited $?"
          tail -60 client.log

      - name: Assert the client came up with mixins applied
        run: |
          set -euo pipefail

          if grep -nE "Mixin apply failed|mixin\.transformer\.throwables|InvalidInjectionException|InvalidAccessorException|InvalidMixinException|ShadowException|Critical injection failure|was not found in" client.log; then
            echo "::error::mixin failure while loading the client - see the lines above"
            exit 1
          fi

          # Not a grep for "cheesecake": the repo path contains it, so that matches every Gradle
          # line whether or not the mod loaded. Assert on the mod's own code having run instead --
          # this line is logged by CheesecakeProvider once the mod has been built for the client.
          if ! grep -q "(Cheesecake) Cheesecake loaded" client.log; then
            echo "::error::the mod never ran: no 'Cheesecake loaded' line in the client log"
            grep -nE "cheesecake" client.log | head -20 || true
            exit 1
          fi

          # Something that only prints once the client is actually up and rendering.
          if ! grep -qE "Backend library: LWJGL|Narrator library|Sound engine started|Created: .*texture" client.log; then
            echo "::error::client never finished starting - no render/sound init markers found"
            sed -n '1,200p' client.log
            exit 1
          fi

          echo "client started, mod code ran, no mixin errors"

      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-log
          path: client.log
          if-no-files-found: ignore

  # The smoke test proves the mod loads. This proves it works: the client creates a survival world
  # from a fixed seed and runs the stages in cheesecake.utils.autotest one after another. A walk
  # with the goal drawn as the box and then as the beacon beam, with a screenshot that has to show
  # the beam; a trip driven over the control socket; climbs up free-hanging, twisting and weeping
  # vines; two #mine runs that have to count what the blocks drop; and elytra flights above the
  # build limit, through the Nether and over its roof. Each stage builds what it needs with server
  # commands. The game exits with PASS once every stage passed. See CheesecakeAutoTest.
  autotest:
    name: in-world pathing test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install a headless GL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libopenal1

      - name: Create a world and run the stages
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          CHEESECAKE_AUTO_TEST: 'true'
        run: |
          set +e

          # What the runner gives us, and what the client will help itself to. Loom sets no -Xmx
          # for runClient, so the client JVM takes the ergonomic default of a quarter of physical
          # memory, on top of the 4G this build's Gradle asks for. Printed so that a kill can be
          # read against the numbers instead of guessed at.
          free -m
          "${JAVA_HOME}/bin/java" -XX:+PrintFlagsFinal -version 2>/dev/null |
            grep -E ' (MaxHeapSize|MaxRAM|MaxRAMPercentage) ' || true

          # Can we read the kernel's own record of a kill? An empty oom.txt has to mean "the kernel
          # recorded no kill", not "we were not allowed to look", or it proves nothing either way.
          if sudo -n dmesg > /dev/null 2>&1; then
            echo "dmesg: readable"
          else
            echo "dmesg: NOT readable, the kernel's record of a kill will not be available"
          fi

          # Sample once a second, and do it with shell builtins only. The first version of this
          # forked pgrep, ps, awk, sed, grep and date on every sample; on a four-core runner that
          # is already saturated by software rendering, that load landed on the thing being
          # measured and took the in-world job from an eight percent failure rate to eighty. A
          # measurement that changes the result is worse than no measurement. So: /proc read
          # through bash's own read, the clock from SECONDS against a base taken once instead of
          # a date per sample, the client looked up once rather than every sample, and no stage
          # tagging here at all -- the report correlates samples with stages afterwards, when the
          # game is gone and forks are free.
          #
          # VmHWM is the kernel's own high-water mark for the process, so the peak survives even
          # if no sample lands on top of a spike. That is what makes one hertz enough.
          #
          # The fifo is the timer: read -t on a pipe that never carries anything waits without
          # forking, which plain sleep cannot do.
          #
          # Each sample is appended rather than written down a redirect held open by the subshell,
          # so that every sample is on disk the moment it is taken: the samples worth having are
          # the last ones before a kill, and those are exactly the ones a buffer would eat.
          mkfifo tick.fifo
          exec 9<> tick.fifo
          epoch_base=$(($(date +%s) - SECONDS))
          : > memory.tsv
          (
            pid=""
            looking=1
            while :; do
              avail=0; swaptotal=0; swapfree=0
              while read -r key value _; do
                case "$key" in
                  MemAvailable:) avail=$value ;;
                  SwapTotal:)    swaptotal=$value ;;
                  SwapFree:)     swapfree=$value ;;
                esac
              done < /proc/meminfo

              # Loom runs the game under its own xvfb-run, and that shell carries the whole java
              # command line in its argv, so the match alone finds a two-megabyte shell first.
              # Take the candidate that is actually a JVM, and only look until it is found.
              if [ -z "$pid" ] && [ "$looking" = 1 ]; then
                for candidate in $(pgrep -f 'fabric[.]dli[.]config' 2>/dev/null); do
                  comm=""
                  read -r comm < "/proc/$candidate/comm" 2>/dev/null
                  if [ "$comm" = "java" ]; then
                    pid=$candidate
                    break
                  fi
                done
              fi

              rss=0; hwm=0
              if [ -n "$pid" ]; then
                if [ -r "/proc/$pid/status" ]; then
                  while read -r key value _; do
                    case "$key" in
                      VmRSS:) rss=$value ;;
                      VmHWM:) hwm=$value ;;
                    esac
                  done < "/proc/$pid/status"
                else
                  # It has gone; the run is over. Stop looking, so the search costs nothing more.
                  pid=""
                  looking=0
                fi
              fi

              printf '%s\t%s\t%s\t%s\t%s\n' \
                "$((epoch_base + SECONDS))" "$avail" "$((swaptotal - swapfree))" "$rss" "$hwm" >> memory.tsv
              read -t 1 -u 9 _ || true
            done
          ) &
          sampler=$!

          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            timeout --signal=INT 1500 ./gradlew runClient --no-daemon > autotest.log 2>&1
          code=$?
          kill "$sampler" 2>/dev/null

          echo "$code" > autotest.exit
          echo "gradle exited $code"

          # Gradle exits 1 whether a stage failed or the client died under it, so the client's own
          # status only shows in the task failure Gradle reports. Take whatever it says rather than
          # looking for one number: 137 is SIGKILL, 134 is SIGABRT -- the C runtime aborting on a
          # corrupted heap -- and 139 is SIGSEGV. A run that died on 134 used to fall through to
          # the stage-failure message and say nothing about the crash at all.
          client_status=$(grep -a "finished with non-zero exit value" autotest.log |
            tail -1 | sed -E 's/.*exit value ([0-9]+).*/\1/')
          echo "${client_status:-}" > autotest.client-status
          killed=no
          case "${client_status:-}" in 134|137|139) killed=yes;; esac
          echo "$killed" > autotest.killed

          # Everything that can say WHY it died, collected whether or not it did: the kernel's
          # record of an out-of-memory kill, the JVM's record of a native crash, and the game's own
          # crash report. Which of these is empty is itself the evidence.
          sudo -n dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process|oom_reaper' > oom.txt
          echo "kernel out-of-memory records: $(wc -l < oom.txt)"
          cat oom.txt

          # systemd-oomd kills a cgroup with SIGKILL on memory-pressure and reports it to the
          # journal, not to the kernel ring buffer, so a kill by it looks exactly like this one:
          # 137, nothing in dmesg, no crash log. Ask the journal too before concluding anything.
          sudo -n journalctl -q --no-pager --since "-20min" -u systemd-oomd 2>/dev/null > oomd.txt
          sudo -n journalctl -q --no-pager --since "-20min" -k 2>/dev/null |
            grep -iE 'killed process|out of memory|oom' >> oomd.txt
          echo "systemd-oomd / journal records: $(wc -l < oomd.txt)"
          cat oomd.txt
          # head -40 stops just short of the only part that names anything: the crashing thread
          # and its frames. Print the header for the signal and then that section.
          ls -1 hs_err_pid*.log run/hs_err_pid*.log 2>/dev/null | while read -r f; do
            echo "--- JVM crash log $f"
            head -20 "$f"
            echo "--- crashing thread and frames"
            sed -n '/^Current thread/,/^siginfo/p' "$f"
          done
          ls -1 run/crash-reports/*.txt 2>/dev/null | while read -r f; do
            echo "--- game crash report $f"
            head -40 "$f"
          done

          grep -nE "\[cheesecake-autotest\] (stage |PASS|FAIL)" autotest.log || true

      # The numbers the kill has to be read against: how close the runner came to having nothing
      # left, and which stage the client was biggest in. Diagnostics only -- continue-on-error,
      # because a failure here would skip the assert step below and turn a run that passed every
      # stage red, which is exactly what happened the first time this was not marked.
      - name: Report the memory ceiling
        if: always()
        continue-on-error: true
        run: scripts/autotest-memory-report.sh memory.tsv autotest.log

      - name: Assert every stage passed
        run: |
          set -euo pipefail

          # A kill is not a stage failure. Say so first and stop: the client never reached its own
          # failure path, so the stage lines end mid-stage and reading them as a hang wastes time.
          if [ "$(cat autotest.killed 2>/dev/null || echo no)" = "yes" ]; then
            during=$(grep -a "cheesecake-autotest\] stage [0-9]* of" autotest.log |
              tail -1 | sed -E 's/.*stage ([0-9]+ of [0-9]+: [a-z0-9-]+).*/stage \1/')
            status=$(cat autotest.client-status 2>/dev/null || echo "")
            if [ "$status" = "134" ] || [ "$status" = "139" ]; then
              echo "::error::the client crashed in native code during ${during:-startup} (exit $status, $([ "$status" = 134 ] && echo SIGABRT || echo SIGSEGV)). This is not a kill and not the runner running out of memory. The JVM crash log names the thread and the frames -- see \"crashing thread and frames\" above, and the hs_err log in the uploaded artifact."
              grep -aE "malloc\(\)|free\(\)|corrupted|double free|Aborted" autotest.log | tail -5 || true
            elif [ -s oom.txt ]; then
              echo "::error::the runner ran out of memory and killed the client (SIGKILL, exit 137) during ${during:-startup}. Nothing in the mod failed. The kernel's record of the kill follows."
              cat oom.txt
            else
              echo "::error::something killed the client with SIGKILL (exit 137) during ${during:-startup}. The kernel recorded no out-of-memory kill, so this is NOT the runner running out of memory -- see the memory ceiling above for how much was free. The client never reached its own failure path, so the stage lines say nothing about why."
            fi
            exit 1
          fi

          if ! grep -q "\[cheesecake-autotest\] PASS" autotest.log; then
            echo "::error::the in-world test did not pass - see the stage lines above and the uploaded log"
            grep -nE "\[cheesecake-autotest\] FAIL|Exception|Caused by" autotest.log | head -40 || true
            grep -n "\[cheesecake-autotest\]" autotest.log | tail -80 || true
            exit 1
          fi
          if [ "$(cat autotest.exit)" != "0" ]; then
            echo "::error::the client exited with status $(cat autotest.exit) after passing"
            exit 1
          fi
          echo "in-world test passed"

      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autotest-log
          path: |
            autotest.log
            memory.tsv
            oom.txt
            oomd.txt
            hs_err_pid*.log
            run/hs_err_pid*.log
            run/crash-reports/*.txt
          if-no-files-found: ignore

      # The walk stage photographs the goal beacon beam; the picture is the one visual check a
      # person can still make from a CI run.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autotest-screenshots
          path: run/screenshots/*.png
          if-no-files-found: ignore

  # A pushed vX.Y.Z tag becomes a GitHub release, but only once the jar has been built, checked,
  # loaded by a real client and driven through the in-world test above. The tag message's body is
  # the release notes; a tag with no body gets GitHub's generated notes. A pre-release suffix
  # (v0.3.0-rc.1) publishes a pre-release.
  release:
    name: publish release
    if: github.ref_type == 'tag'
    needs: [build, smoke, autotest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download the built jar
        uses: actions/download-artifact@v8
        with:
          name: cheesecake-jar
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          jar=$(ls dist/*.jar | grep -v -- '-sources' | head -1)
          name=$(basename "$jar")
          if [ "$name" != "cheesecake-${version}.jar" ]; then
            echo "::error::built jar $name does not match tag $tag"
            exit 1
          fi

          (cd dist && sha256sum "$name" > SHA256SUMS)
          sum=$(cut -d' ' -f1 dist/SHA256SUMS)

          body=$(git tag -l --format='%(contents:body)' "$tag")
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$tag" --jq .body)
          fi

          {
            printf '%s\n\n' "$body"
            printf 'Requires Minecraft 26.2, Fabric Loader 0.19.5 or newer and Java 25. Copy the jar into the `mods` folder of a Fabric profile.\n\n'
            printf 'SHA-256 of `%s`: `%s`\n' "$name" "$sum"
          } > notes.md

          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac

          gh release create "$tag" "$jar" dist/SHA256SUMS \
            --verify-tag \
            --title "Cheesecake ${version}" \
            --notes-file notes.md \
            "${prerelease[@]}"
          echo "published ${tag}: ${name} (${sum})"
