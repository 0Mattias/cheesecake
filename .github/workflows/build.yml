name: Build

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # The mod's version comes from `git describe --tags`, so the build needs the tags and
          # enough history to reach one. A tag push therefore produces cheesecake-X.Y.Z.jar and a
          # branch push cheesecake-X.Y.Z-N-gSHA.jar, which keeps snapshots distinguishable.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon

      - name: Check the built jar
        run: |
          set -euo pipefail
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Inspecting $jar"

          # The Schematica/Litematica API stubs are compile-only. Shipping them would shadow the
          # real mods on Fabric's flat mod classpath.
          if unzip -l "$jar" | grep -E ' (fi/dy/masa|com/github/lunatrius)/'; then
            echo "::error::jar ships Schematica/Litematica stub classes"
            exit 1
          fi

          # The in-world test harness lives in its own source set so that it does not ship. Only
          # AutoTestHook, which looks the driver up by name, belongs in the jar.
          if unzip -l "$jar" | grep -E ' cheesecake/utils/autotest/'; then
            echo "::error::jar ships the in-world test harness"
            exit 1
          fi

          # The nether-pathfinder library is bundled as a nested jar; without it the elytra
          # process is unavailable at runtime.
          if ! unzip -l "$jar" | grep -q 'META-INF/jars/nether-pathfinder'; then
            echo "::error::jar does not bundle nether-pathfinder"
            exit 1
          fi

          # processResources must have substituted the real version.
          unzip -p "$jar" fabric.mod.json | tee /tmp/fabric.mod.json
          if grep -q '\${version}' /tmp/fabric.mod.json; then
            echo "::error::fabric.mod.json version was not expanded"
            exit 1
          fi

          # The icon fabric.mod.json points at has to actually be in the jar.
          unzip -l "$jar" | grep -q 'assets/cheesecake/icon.png'

          # A tag build must be named after the tag, otherwise the tags were not fetched and the
          # jar would silently carry the fallback version from gradle.properties.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected="cheesecake-${GITHUB_REF_NAME#v}.jar"
            if [ "$(basename "$jar")" != "$expected" ]; then
              echo "::error::expected $expected for tag ${GITHUB_REF_NAME}, got $(basename "$jar")"
              exit 1
            fi
          fi

          echo "jar checks passed"

      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: cheesecake-jar
          path: build/libs/*.jar

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/reports/tests/test
          if-no-files-found: ignore

  # The build proves the mixin configs are well-formed. It does not prove they APPLY -- that
  # happens at class load in a running client. Launch one headless on software GL and fail on any
  # mixin error. Getting to the main menu means every @Mixin target, @Shadow and @Inject resolved
  # against the real Minecraft classes.
  smoke:
    name: headless client smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install a headless GL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libopenal1

      - name: Launch the client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
        run: |
          set +e
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            timeout --signal=INT 300 ./gradlew runClient --no-daemon --stacktrace > client.log 2>&1
          echo "gradle exited $?"
          tail -60 client.log

      - name: Assert the client came up with mixins applied
        run: |
          set -euo pipefail

          if grep -nE "Mixin apply failed|mixin\.transformer\.throwables|InvalidInjectionException|InvalidAccessorException|InvalidMixinException|ShadowException|Critical injection failure|was not found in" client.log; then
            echo "::error::mixin failure while loading the client - see the lines above"
            exit 1
          fi

          # Not a grep for "cheesecake": the repo path contains it, so that matches every Gradle
          # line whether or not the mod loaded. Assert on the mod's own code having run instead --
          # this line is printed by the nether-pathfinder native that we bundle and load.
          if ! grep -q "\[nether-pathfinder\] Loaded shared library" client.log; then
            echo "::error::the mod never ran: no nether-pathfinder native load in the client log"
            grep -nE "cheesecake" client.log | head -20 || true
            exit 1
          fi

          # Something that only prints once the client is actually up and rendering.
          if ! grep -qE "Backend library: LWJGL|Narrator library|Sound engine started|Created: .*texture" client.log; then
            echo "::error::client never finished starting - no render/sound init markers found"
            sed -n '1,200p' client.log
            exit 1
          fi

          echo "client started, mod code ran, no mixin errors"

      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-log
          path: client.log
          if-no-files-found: ignore

  # The smoke test proves the mod loads. This proves it works: the client creates a survival world
  # from a fixed seed and runs the stages in cheesecake.utils.autotest one after another. A walk
  # with the goal drawn as the box and then as the beacon beam, with a screenshot that has to show
  # the beam; a trip driven over the control socket; climbs up free-hanging, twisting and weeping
  # vines; two #mine runs that have to count what the blocks drop; and elytra flights above the
  # build limit, through the Nether and over its roof. Each stage builds what it needs with server
  # commands. The game exits with PASS once every stage passed. See CheesecakeAutoTest.
  autotest:
    name: in-world pathing test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Install a headless GL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils libopenal1

      - name: Create a world and run the stages
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GALLIUM_DRIVER: llvmpipe
          CHEESECAKE_AUTO_TEST: 'true'
        run: |
          set +e

          # What the runner gives us, and what the client will help itself to. Loom sets no -Xmx
          # for runClient, so the client JVM takes the ergonomic default of a quarter of physical
          # memory, on top of the 4G this build's Gradle asks for. Printed so that a kill can be
          # read against the numbers instead of guessed at.
          free -m
          "${JAVA_HOME}/bin/java" -XX:+PrintFlagsFinal -version 2>/dev/null |
            grep -E ' (MaxHeapSize|MaxRAM|MaxRAMPercentage) ' || true

          # Sample every five seconds for the whole run and tag each sample with the stage that was
          # running, so that a kill can be attributed to one. The client is the java process that
          # is not Gradle's.
          : > memory.tsv
          (
            while true; do
              read -r avail swap <<< "$(awk '
                /^MemAvailable:/ { a = $2 }
                /^SwapTotal:/    { t = $2 }
                /^SwapFree:/     { f = $2 }
                END { print a, t - f }' /proc/meminfo)"
              read -r gradle client <<< "$(ps -eo rss=,args= | awk '
                /[j]ava/ {
                  if ($0 ~ /GradleWrapperMain|GradleDaemon|gradle-launcher/) { g += $1 } else { c += $1 }
                }
                END { print g + 0, c + 0 }')"
              stage=$(grep -a "cheesecake-autotest\] stage [0-9]* of" autotest.log 2>/dev/null |
                tail -1 | sed -E 's/.*stage ([0-9]+ of [0-9]+: [a-z0-9-]+).*/\1/')
              printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
                "$(date -u +%H:%M:%S)" "$avail" "$swap" "$gradle" "$client" "${stage:-starting}" >> memory.tsv
              sleep 5
            done
          ) &
          sampler=$!

          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            timeout --signal=INT 1500 ./gradlew runClient --no-daemon > autotest.log 2>&1
          code=$?
          kill "$sampler" 2>/dev/null

          echo "$code" > autotest.exit
          echo "gradle exited $code"

          # 137 is SIGKILL. Gradle exits 1 whether a stage failed or the client was killed under it,
          # so the kill only shows in the task failure Gradle reports and, when the runner lets us
          # read the ring buffer, in the kernel's own record of the kill.
          killed=no
          if grep -qa "finished with non-zero exit value 137" autotest.log; then killed=yes; fi
          sudo -n dmesg 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' | tail -5 > oom.txt
          if [ -s oom.txt ]; then killed=yes; fi
          echo "$killed" > autotest.killed

          grep -nE "\[cheesecake-autotest\] (stage |PASS|FAIL)" autotest.log || true

      # The numbers the kill has to be read against: how close the runner came to having nothing
      # left, and which stage the client was biggest in.
      - name: Report the memory ceiling
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s memory.tsv ]; then
            echo "no samples were taken"
            exit 0
          fi
          awk '/^MemTotal:/ { printf "runner memory: %d MiB total\n", $2 / 1024 }' /proc/meminfo
          echo
          echo "tightest ten samples:"
          sort -t"$(printf '\t')" -k2 -n memory.tsv | head -10 |
            awk -F'\t' '{ printf "  %s  available %6d MiB  swap used %5d MiB  gradle %5d MiB  client %5d MiB  %s\n", $1, $2/1024, $3/1024, $4/1024, $5/1024, $6 }'
          echo
          echo "peak client RSS per stage:"
          awk -F'\t' '
            { if ($5 + 0 > peak[$6]) peak[$6] = $5 + 0; if (!($6 in seen)) { seen[$6] = ++n } }
            END { for (s in peak) printf "%d\t%d\t%s\n", seen[s], peak[s] / 1024, s }' memory.tsv |
            sort -n | awk -F'\t' '{ printf "  %5d MiB  %s\n", $2, $3 }'

      - name: Assert every stage passed
        run: |
          set -euo pipefail

          # A kill is not a stage failure. Say so first and stop: the client never reached its own
          # failure path, so the stage lines end mid-stage and reading them as a hang wastes time.
          if [ "$(cat autotest.killed 2>/dev/null || echo no)" = "yes" ]; then
            during=$(grep -a "cheesecake-autotest\] stage [0-9]* of" autotest.log |
              tail -1 | sed -E 's/.*stage ([0-9]+ of [0-9]+: [a-z0-9-]+).*/stage \1/')
            echo "::error::the runner killed the client (SIGKILL, exit 137) during ${during:-startup}: it ran out of memory, nothing in the mod failed. See the memory ceiling above."
            cat oom.txt 2>/dev/null || true
            exit 1
          fi

          if ! grep -q "\[cheesecake-autotest\] PASS" autotest.log; then
            echo "::error::the in-world test did not pass - see the stage lines above and the uploaded log"
            grep -nE "\[cheesecake-autotest\] FAIL|Exception|Caused by" autotest.log | head -40 || true
            grep -n "\[cheesecake-autotest\]" autotest.log | tail -80 || true
            exit 1
          fi
          if [ "$(cat autotest.exit)" != "0" ]; then
            echo "::error::the client exited with status $(cat autotest.exit) after passing"
            exit 1
          fi
          echo "in-world test passed"

      - name: Upload client log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autotest-log
          path: |
            autotest.log
            memory.tsv
          if-no-files-found: ignore

      # The walk stage photographs the goal beacon beam; the picture is the one visual check a
      # person can still make from a CI run.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: autotest-screenshots
          path: run/screenshots/*.png
          if-no-files-found: ignore

  # A pushed vX.Y.Z tag becomes a GitHub release, but only once the jar has been built, checked,
  # loaded by a real client and driven through the in-world test above. The tag message's body is
  # the release notes; a tag with no body gets GitHub's generated notes. A pre-release suffix
  # (v0.3.0-rc.1) publishes a pre-release.
  release:
    name: publish release
    if: github.ref_type == 'tag'
    needs: [build, smoke, autotest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download the built jar
        uses: actions/download-artifact@v8
        with:
          name: cheesecake-jar
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          jar=$(ls dist/*.jar | grep -v -- '-sources' | head -1)
          name=$(basename "$jar")
          if [ "$name" != "cheesecake-${version}.jar" ]; then
            echo "::error::built jar $name does not match tag $tag"
            exit 1
          fi

          (cd dist && sha256sum "$name" > SHA256SUMS)
          sum=$(cut -d' ' -f1 dist/SHA256SUMS)

          body=$(git tag -l --format='%(contents:body)' "$tag")
          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            body=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" -f tag_name="$tag" --jq .body)
          fi

          {
            printf '%s\n\n' "$body"
            printf 'Requires Minecraft 26.2, Fabric Loader 0.19.5 or newer and Java 25. Copy the jar into the `mods` folder of a Fabric profile.\n\n'
            printf 'SHA-256 of `%s`: `%s`\n' "$name" "$sum"
          } > notes.md

          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac

          gh release create "$tag" "$jar" dist/SHA256SUMS \
            --verify-tag \
            --title "Cheesecake ${version}" \
            --notes-file notes.md \
            "${prerelease[@]}"
          echo "published ${tag}: ${name} (${sum})"
